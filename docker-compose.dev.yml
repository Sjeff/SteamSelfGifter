services:
  steamselfgifter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steamselfgifter
    ports:
      - "8080:80"
    volumes:
      - steamselfgifter-dev-data:/config
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  steamselfgifter-dev-data:
