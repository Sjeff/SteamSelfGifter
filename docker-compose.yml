services:
  steamselfgifter:
    image: ghcr.io/sjeff/steamselfgifter:latest
    container_name: steamselfgifter
    ports:
      - "8080:80"
    volumes:
      - steamselfgifter-data:/config
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  steamselfgifter-data:
