services:
  steamselfgifter:
    image: ghcr.io/sjeff/steamselfgifter:latest
    container_name: steamselfgifter
    ports:
      - "8080:80"
    volumes:
      - steamselfgifter-data:/config
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      # This compose file has no TLS termination, so the login cookie must
      # not require HTTPS. Set to true if you put this behind your own
      # HTTPS reverse proxy.
      - SESSION_COOKIE_SECURE=false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  steamselfgifter-data:
